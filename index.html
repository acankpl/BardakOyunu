        function updateFrictionTrailEffects() {
            for (let i = frictionTrailEffects.length - 1; i >= 0; i--) {
                const tr = frictionTrailEffects[i];
                tr.age++;
                const t = tr.age / tr.maxAge;
                tr.mesh.material.opacity = (1 - t) * 0.18;
                tr.mesh.scale.setScalar(1 - t * 0.35);
                if (tr.age >= tr.maxAge) {
                    scene.remove(tr.mesh);
                    frictionTrailEffects.splice(i, 1);
                }
            }
        }

        function updateCaustics() {
            glasses.forEach(g => {
                const shadow = g.userData.shadowMesh || g.userData.causticMesh;
                if (!shadow) return;
                const r = g.userData.radius || 0.26;
                shadow.position.y = -g.position.y + 0.003;
                shadow.position.x = r * 0.12;
                shadow.position.z = -r * 0.22;
            });
        }

        function updateGamePhysics() {
            for (let i = 0; i < glasses.length; i++) {
                const g = glasses[i];
                if (g.userData.spawnAnimScale < 1.0) {
                    g.userData.spawnAnimScale = Math.min(1.0, g.userData.spawnAnimScale + 0.12);
                    g.scale.setScalar(g.userData.spawnAnimScale);
                }
            }

            if (!isGameActive) return;

            let anyMoved = false;

            for (let i = 0; i < glasses.length; i++) {
                const g = glasses[i];
                if (g.userData.isWaitingToLaunch) continue;
                if (g.userData.isShowcase) {
                    g.userData.vx = 0;
                    g.userData.vz = 0;
                    continue;
                }

                const speed = Math.hypot(g.userData.vx, g.userData.vz);
                if (speed > 0.0014) {
                    anyMoved = true;
                    g.position.x += g.userData.vx;
                    g.position.z += g.userData.vz;

                    // Dinamik kayma mekaniği: Yoldaki engellere (diğer bardaklar veya masa sonu) yaklaştıkça normal hıza pürüzsüz smoothstep yavaşlama
                    let currentFriction = SURFACE_FRICTION;
                    let extraDrag = SURFACE_DRAG_DECEL;

                    if (g.userData.isLaunchedSlide) {
                        // Bardak yoldayken kulvarındaki en yakın engeli (diğer bardaklar veya masanın son bandı) tespit et:
                        let distToObstacle = (g.position.z - g.userData.radius) - PLAY_MIN_Z;
                        const specG = GLASS_LEVELS[g.userData.level] || GLASS_LEVELS[1];
                        for (let k = 0; k < glasses.length; k++) {
                            const other = glasses[k];
                            if (other === g || other.userData.isWaitingToLaunch) continue;
                            if (other.position.z < g.position.z) {
                                const specO = GLASS_LEVELS[other.userData.level] || GLASS_LEVELS[1];
                                const contactH = Math.min(specG.height, specO.height);
                                const effRG = getEffectiveContactRadius(specG, contactH);
                                const effRO = getEffectiveContactRadius(specO, contactH);
                                const combinedR = effRG + effRO;
                                const latDiff = Math.abs(other.position.x - g.position.x);
                                if (latDiff < combinedR + 0.08) {
                                    const dAhead = (g.position.z - effRG) - (other.position.z + effRO);
                                    if (dAhead >= 0 && dAhead < distToObstacle) {
                                        distToObstacle = dAhead;
                                    }
                                }
                            }
                        }

                        // Önündeki bardağa veya masa sonuna yaklaştıkça normal hıza pürüzsüz frenleme:
                        if (distToObstacle < 1.85) {
                            const approachSpeed = 0.075;
                            const t = Math.max(0, Math.min(1, 1 - distToObstacle / 1.85));
                            const smoothT = t * t * (3 - 2 * t);
                            currentFriction = 0.988 - smoothT * 0.065;
                            extraDrag = 0.0001;
                            // Karşı banda veya hedef bardağa varmadan önce erken durmaması için akıcı seyir hızını koru:
                            if (speed < approachSpeed && distToObstacle > 0.02) {
                                currentFriction = 1.0;
                                extraDrag = 0;
                            }
                        }

                        if (distToObstacle <= 0.025) {
                            g.userData.isLaunchedSlide = false;
                        }
                    }

                    const dampedSpeed = Math.max(0, speed * currentFriction - extraDrag);
                    const ratio = dampedSpeed / speed;
                    g.userData.vx *= ratio;
                    g.userData.vz *= ratio;

                    if (speed > 0.03 && Math.random() < 0.35) {
                        const spec = GLASS_LEVELS[g.userData.level] || GLASS_LEVELS[1];
                        spawnFrictionSlideTrail(g.position.x, g.position.z, g.userData.radius, spec.liquidColor);
                    }

                    const r = g.userData.radius;

                    // Başlangıç çizgisine doğru geri gelen (vz > 0) bardaklar için kademeli yavaşlama ve durma:
                    if (g.userData.vz > 0) {
                        const distToLaunchLine = LAUNCH_Z - g.position.z;
                        if (distToLaunchLine < 0.85 && distToLaunchLine > 0) {
                            const brakeFactor = Math.max(0, Math.min(1, 1 - distToLaunchLine / 0.85));
                            g.userData.vz *= (1 - brakeFactor * 0.32);
                            g.userData.vx *= (1 - brakeFactor * 0.20);
                        }
                    }

                    if (g.position.x - r < PLAY_MIN_X) {
                        g.position.x = PLAY_MIN_X + r;
                        g.userData.vx = Math.abs(g.userData.vx) * WALL_BOUNCE;
                        g.userData.vz *= 0.96;
                    } else if (g.position.x + r > PLAY_MAX_X) {
                        g.position.x = PLAY_MAX_X - r;
                        g.userData.vx = -Math.abs(g.userData.vx) * WALL_BOUNCE;
                        g.userData.vz *= 0.96;
                    }

                    if (g.position.z - r < PLAY_MIN_Z) {
                        g.position.z = PLAY_MIN_Z + r;
                        g.userData.vz = Math.min(0.006, Math.abs(g.userData.vz) * 0.08);
                        g.userData.vx *= 0.85;
                        g.userData.isLaunchedSlide = false;
                        playGameSound('clink', g.userData.level);
                    } else if (g.userData.vz > 0 && g.position.z >= LAUNCH_Z + 0.15) {
                        // Masadaki bardaklar geri teptiğinde çizgiyi aşarsa durdurulur ve uyarı başlatılır:
                        g.position.z = LAUNCH_Z + 0.15;
                        g.userData.vz = 0;
                        g.userData.vx *= 0.82;
                        g.userData.isLaunchedSlide = false;
                    } else if (g.position.z + r > PLAY_MAX_Z) {
                        g.position.z = PLAY_MAX_Z - r;
                        g.userData.vz = -Math.abs(g.userData.vz) * WALL_BOUNCE;
                        g.userData.vx *= 0.96;
                        g.userData.isLaunchedSlide = false;
                    }
                } else {
                    g.userData.vx = 0;
                    g.userData.vz = 0;
                }
            }

            // Bardakların Çarpışması ve Aynı Seviye Birleşmesi
            const toRemove = new Set();
            const toSpawn = [];

            for (let i = 0; i < glasses.length; i++) {
                const gA = glasses[i];
                if (gA.userData.isWaitingToLaunch || toRemove.has(gA)) continue;

                for (let j = i + 1; j < glasses.length; j++) {
                    const gB = glasses[j];
                    if (gB.userData.isWaitingToLaunch || toRemove.has(gB)) continue;

                    // Vitrin test bardaklarının kendi arasında birbirini itmesini engelle
                    if (gA.userData.isShowcase && gB.userData.isShowcase) continue;

                    const dx = gB.position.x - gA.position.x;
                    const dz = gB.position.z - gA.position.z;
                    const dist = Math.hypot(dx, dz);

                    const specA = GLASS_LEVELS[gA.userData.level] || GLASS_LEVELS[1];
                    const specB = GLASS_LEVELS[gB.userData.level] || GLASS_LEVELS[1];
                    const contactH = Math.min(specA.height, specB.height);
                    const effRA = getEffectiveContactRadius(specA, contactH);
                    const effRB = getEffectiveContactRadius(specB, contactH);
                    const minDist = effRA + effRB;

                    if (dist < minDist && dist > 0.0001) {
                        anyMoved = true;

                        if (gA.userData.level === gB.userData.level && gA.userData.level < 7) {
                            toRemove.add(gA);
                            toRemove.add(gB);

                            const midX = (gA.position.x + gB.position.x) * 0.5;
                            const midZ = (gA.position.z + gB.position.z) * 0.5;
                            const currLvl = gA.userData.level;
                            const nextLvl = currLvl + 1;

                            toSpawn.push({
                                level: nextLvl,
                                x: midX,
                                z: midZ,
                                vx: (gA.userData.vx + gB.userData.vx) * MERGE_VELOCITY_CARRY,
                                vz: (gA.userData.vz + gB.userData.vz) * MERGE_VELOCITY_CARRY
                            });
                            gameScore += nextLvl * 30;
                            playGameSound('merge', nextLvl);
                            totalMerges++;
                            const spec = GLASS_LEVELS[currLvl] || GLASS_LEVELS[1];
                            spawnMergeExplosion(midX, 0.25, midZ, spec.liquidColor, gA.userData.radius * 1.55);
                            updateScoreHUD();
                            triggerScorePlaqueBump();
                            continue;
                        }

                        const nx = dx / dist;
                        const nz = dz / dist;
                        const overlap = minDist - dist;

                        const totalMass = gA.userData.mass + gB.userData.mass;
                        gA.position.x -= nx * overlap * (gB.userData.mass / totalMass);
                        gA.position.z -= nz * overlap * (gB.userData.mass / totalMass);
                        gB.position.x += nx * overlap * (gA.userData.mass / totalMass);
                        gB.position.z += nz * overlap * (gA.userData.mass / totalMass);

                        // Çarpışma itmesi sonrasında hiçbir bardağın masa kenarlıklarından dışarı taşmaması için anında sınır kilidi:
                        const rA = gA.userData.radius;
                        const rB = gB.userData.radius;
                        gA.position.x = THREE.MathUtils.clamp(gA.position.x, PLAY_MIN_X + rA, PLAY_MAX_X - rA);
                        gA.position.z = THREE.MathUtils.clamp(gA.position.z, PLAY_MIN_Z + rA, PLAY_MAX_Z - rA);
                        gB.position.x = THREE.MathUtils.clamp(gB.position.x, PLAY_MIN_X + rB, PLAY_MAX_X - rB);
                        gB.position.z = THREE.MathUtils.clamp(gB.position.z, PLAY_MIN_Z + rB, PLAY_MAX_Z - rB);

                        const kx = gA.userData.vx - gB.userData.vx;
                        const kz = gA.userData.vz - gB.userData.vz;
                        const p = 2 * (nx * kx + nz * kz) / totalMass;

                        if (p > 0) {
                            gA.userData.isLaunchedSlide = false;
                            gB.userData.isLaunchedSlide = false;
                            gA.userData.vx = (gA.userData.vx - p * gB.userData.mass * nx * COLLISION_RESTITUTION) * POST_COLLISION_GRIP;
                            gA.userData.vz = (gA.userData.vz - p * gB.userData.mass * nz * COLLISION_RESTITUTION) * POST_COLLISION_GRIP;
                            gB.userData.vx = (gB.userData.vx + p * gA.userData.mass * nx * COLLISION_RESTITUTION) * POST_COLLISION_GRIP;
                            gB.userData.vz = (gB.userData.vz + p * gA.userData.mass * nz * COLLISION_RESTITUTION) * POST_COLLISION_GRIP;

                            if (Math.hypot(kx, kz) > 0.025) {
                                playGameSound('clink', Math.max(gA.userData.level, gB.userData.level));
                            }
                        }
                    }
                }
            }

            if (toRemove.size > 0) {
                toRemove.forEach(rem => {
                    scene.remove(rem);
                    const idx = glasses.indexOf(rem);
                    if (idx !== -1) glasses.splice(idx, 1);
                });

                toSpawn.forEach(sp => {
                    const mergedGlass = buildGlassByLevel(sp.level);
                    const r = mergedGlass.userData.radius;
                    const clampedX = THREE.MathUtils.clamp(sp.x, PLAY_MIN_X + r, PLAY_MAX_X - r);
                    const clampedZ = THREE.MathUtils.clamp(sp.z, PLAY_MIN_Z + r, LAUNCH_Z - r);
                    mergedGlass.position.set(clampedX, 0, clampedZ);
                    mergedGlass.userData.vx = sp.vx;
                    mergedGlass.userData.vz = sp.vz;
                    mergedGlass.userData.isLaunchedSlide = false;
                    mergedGlass.userData.spawnAnimScale = 0.25;
                    mergedGlass.scale.setScalar(0.25);
                    scene.add(mergedGlass);
                    glasses.push(mergedGlass);
                });
            }

            if (anyMoved) {
                updateCaustics();
            }
        }

        // =========================================================================
        // 9. DOKUNMATİK VE FARE ETKİLEŞİMLERİ (MASANIN HER NOKTASINDA KESİN ÇALIŞIR)
        // =========================================================================
        function computeAimXFromEvent(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouseNDC, camera);
            dragPlaneXZ.constant = 0;
            if (raycaster.ray.intersectPlane(dragPlaneXZ, planeIntersectPoint)) {
                return planeIntersectPoint.x;
            }
            return mouseNDC.x * (PLAY_MAX_X - PLAY_MIN_X) * 0.55;
        }

        function handleBlastTap(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouseNDC, camera);
            const candidates = glasses.filter(g => !g.userData.isWaitingToLaunch);
            const intersects = raycaster.intersectObjects(candidates, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj && !hitObj.userData.level && hitObj.parent && hitObj.parent !== scene) {
                    hitObj = hitObj.parent;
                }
                if (hitObj && hitObj.userData && hitObj.userData.level) {
                    blastGlass(hitObj);
                }
            }
        }

        function blastGlass(targetGlass) {
            const lvl = targetGlass.userData.level;
            const spec = GLASS_LEVELS[lvl] || GLASS_LEVELS[1];
            spawnMergeExplosion(targetGlass.position.x, 0.35, targetGlass.position.z, spec.liquidColor, targetGlass.userData.radius * 1.8);
            playGameSound('clink', lvl);

            scene.remove(targetGlass);
            const idx = glasses.indexOf(targetGlass);
            if (idx !== -1) glasses.splice(idx, 1);

            gameScore += lvl * 40;
            updateScoreHUD();
            triggerScorePlaqueBump();
            updateCaustics();

            remainingBlasts--;
            const countText = document.getElementById('blast-count-text');
            if (countText) countText.textContent = remainingBlasts;

            if (remainingBlasts <= 0) {
                exitBlastMode();
                showToast('💥 3 Kupa Başarıyla Patlatıldı!');
            }
        }

        function startBlastMode() {
            isTargetBlastActive = true;
            remainingBlasts = 3;
            const banner = document.getElementById('blast-mode-banner');
            const countText = document.getElementById('blast-count-text');
            if (countText) countText.textContent = remainingBlasts;
            if (banner) banner.classList.remove('hidden');
            if (aimGuideGroup) aimGuideGroup.visible = false;
            showToast('🎯 Patlatmak istediğin bardağa dokun (3 hakkın var)');
        }

        function cancelBlastMode(ev) {
            stopEvt(ev);
            exitBlastMode();
            showToast('İptal edildi');
        }

        function exitBlastMode() {
            isTargetBlastActive = false;
            remainingBlasts = 0;
            const banner = document.getElementById('blast-mode-banner');
            if (banner) banner.classList.add('hidden');
            if (aimGuideGroup) aimGuideGroup.visible = true;
        }

        function activateBooster(type, ev) {
            stopEvt(ev);
            if (!isGameActive || isGameOver) return;

            if (type === 'blast') {
                showRewardedAd(() => {
                    startBlastMode();
                });
            } else if (type === 'shake') {
                showRewardedAd(() => {
                    triggerEarthquake();
                });
            } else if (type === 'magnet') {
                showRewardedAd(() => {
                    triggerMagneticMerge();
                });
            }
        }

        function triggerEarthquake() {
            isEarthquakeActive = true;
            earthquakeStartTime = performance.now();
            earthquakeDuration = 1800;

            if (soundEnabled && audioCtx) {
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(50, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 1.8);
                    gain.gain.setValueAtTime(0.20, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 1.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.85);
                } catch(e) {}
            }

            glasses.forEach(g => {
                if (!g.userData.isWaitingToLaunch) {
                    g.userData.vx += (Math.random() - 0.5) * 0.22;
                    g.userData.vz += (Math.random() - 0.5) * 0.22;
                    g.userData.isLaunchedSlide = false;
                }
            });

            showToast('🌋 Deprem! Masa güçlüce sallandı!');
        }

        function updateEarthquake() {
            if (!isEarthquakeActive) return;
            const elapsed = performance.now() - earthquakeStartTime;
            if (elapsed < earthquakeDuration) {
                const factor = 1 - elapsed / earthquakeDuration;
                if (camera) {
                    camera.position.x += (Math.random() - 0.5) * 0.12 * factor;
                    camera.position.y += (Math.random() - 0.5) * 0.08 * factor;
                    camera.position.z += (Math.random() - 0.5) * 0.12 * factor;
                }
                if (Math.random() < 0.15) {
                    playGameSound('clink', Math.floor(Math.random() * 4) + 1);
                }
            } else {
                isEarthquakeActive = false;
                if (camera) updateCameraFromSpherical();
            }
        }

        function triggerMagneticMerge() {
            const available = glasses.filter(g => !g.userData.isWaitingToLaunch);
            const byLevel = {};
            available.forEach(g => {
                const lvl = g.userData.level;
                byLevel[lvl] = byLevel[lvl] || [];
                byLevel[lvl].push(g);
            });

            let pairsAttracted = 0;
            Object.keys(byLevel).forEach(lvlKey => {
                const lvl = parseInt(lvlKey, 10);
                if (lvl >= 7) return;
                const list = byLevel[lvl];
                while (list.length >= 2) {
                    const cupA = list.shift();
                    const cupB = list.shift();
                    pairsAttracted++;

                    const dx = cupB.position.x - cupA.position.x;
                    const dz = cupB.position.z - cupA.position.z;
                    const dist = Math.max(0.08, Math.hypot(dx, dz));
                    const pullSpeed = 0.18;

                    cupA.userData.vx += (dx / dist) * pullSpeed;
                    cupA.userData.vz += (dz / dist) * pullSpeed;
                    cupB.userData.vx -= (dx / dist) * pullSpeed;
                    cupB.userData.vz -= (dz / dist) * pullSpeed;
                    cupA.userData.isLaunchedSlide = false;
                    cupB.userData.isLaunchedSlide = false;

                    const midX = (cupA.position.x + cupB.position.x) * 0.5;
                    const midZ = (cupA.position.z + cupB.position.z) * 0.5;
                    spawnMergeExplosion(midX, 0.25, midZ, '#fde047', 0.55);
                }
            });

            if (pairsAttracted > 0) {
                playGameSound('merge', 3);
                showToast('🧲 Manyetik Çekim! Eşleşen kupalar birbirine çekiliyor!');
            } else {
                available.forEach(g => {
                    g.userData.vx += (0 - g.position.x) * 0.08;
                    g.userData.vz += (-1.0 - g.position.z) * 0.08;
                    g.userData.isLaunchedSlide = false;
                });
                playGameSound('clink', 4);
                showToast('🧲 Manyetik Alan! Tüm bardaklar merkeze toplandı!');
            }
        }

        function showRewardedAd(onReward) {
            pendingAdReward = onReward;

            const modal = document.getElementById('rewarded-ad-modal');
            const timerText = document.getElementById('ad-timer-text');
            const progressBar = document.getElementById('ad-progress-bar');
            const claimBtn = document.getElementById('btn-ad-claim');

            if (!modal) {
                if (typeof onReward === 'function') onReward();
                return;
            }

            modal.classList.remove('hidden');
            if (claimBtn) {
                claimBtn.classList.add('disabled');
                claimBtn.textContent = 'Ödül Hazırlanıyor...';
            }
            if (progressBar) {
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                void progressBar.offsetWidth;
                progressBar.style.transition = 'width 3s linear';
                progressBar.style.width = '100%';
            }

            let timeLeft = 3;
            if (timerText) timerText.textContent = timeLeft + ' sn';

            clearInterval(adTimerInterval);
            adTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    if (timerText) timerText.textContent = timeLeft + ' sn';
                } else {
                    clearInterval(adTimerInterval);
                    if (timerText) timerText.textContent = 'Hazır!';
                    if (claimBtn) {
                        claimBtn.classList.remove('disabled');
                        claimBtn.textContent = '✨ ÖDÜLÜ AL & DEVAM ET';
                    }
                    setTimeout(() => {
                        claimAdReward();
                    }, 450);
                }
            }, 1000);
        }

        function claimAdReward(ev) {
            stopEvt(ev);
            const claimBtn = document.getElementById('btn-ad-claim');
            if (claimBtn && claimBtn.classList.contains('disabled')) return;

            const modal = document.getElementById('rewarded-ad-modal');
            if (modal) modal.classList.add('hidden');
            clearInterval(adTimerInterval);

            if (typeof pendingAdReward === 'function') {
                const rewardFn = pendingAdReward;
                pendingAdReward = null;
                rewardFn();
            }
        }

        function checkTableFullCondition() {
            if (!isGameActive || isGameOver) {
                if (baulkLineMesh && baulkLineMesh.material) {
                    baulkLineMesh.material.color.setHex(0xfef3c7);
                    baulkLineMesh.material.opacity = 0.50;
                }
                return;
            }

            let offendingCup = null;

            for (let i = 0; i < glasses.length; i++) {
                const g = glasses[i];
                if (g.userData.isWaitingToLaunch) continue;

                // Yeni fırlatılan bardağın masanın içine doğru ilk kayış süresi (0.35s) hariç
                if (g.userData.launchGraceTime > 0) {
                    g.userData.launchGraceTime -= 1 / 60;
                    continue;
                }

                // Çizgiyi tam olarak geçme kuralı:
                // Bardak ancak gövde merkezi sınır çizgisine ulaştığında veya aştığında (g.position.z >= LAUNCH_Z - 0.08)
                // çizgi aşımı uyarısı başlar.
                if (g.position.z >= LAUNCH_Z - 0.08) {
                    offendingCup = g;
                    break;
                }
            }

            if (offendingCup) {
                isDangerActive = true;
                dangerCup = offendingCup;
                tableFullWarningTimer += 1 / 60;

                // Sınır çizgisini kırmızı/altın neon uyarısıyla ışıldat:
                if (baulkLineMesh && baulkLineMesh.material) {
                    const pulse = (Math.sin(Date.now() * 0.012) + 1) * 0.5;
                    baulkLineMesh.material.color.setRGB(1.0, 0.15 + pulse * 0.35, 0.1);
                    baulkLineMesh.material.opacity = 0.85 + pulse * 0.15;
                }

                // Çizgiyi geçen bardağı ritmik kırmızı/altın titreşimle belli et:
                if (offendingCup.userData.glassMesh) {
                    const pulseScale = 1.0 + Math.sin(Date.now() * 0.015) * 0.06;
                    offendingCup.scale.set(pulseScale, pulseScale, pulseScale);
                }

                // Oyuncunun ne olduğunu görmesi ve kurtarma şansı olması için 1.6 saniye boyunca çizgi aşımında kalırsa:
                if (tableFullWarningTimer >= 1.6) {
                    triggerGameOver(offendingCup);
                }
            } else {
                // Çizgi aşımı yok veya bardak güvenli bölgeye geri sekti:
                if (tableFullWarningTimer > 0) {
                    tableFullWarningTimer = Math.max(0, tableFullWarningTimer - 2 / 60);
                }
                isDangerActive = false;
                if (dangerCup && dangerCup.userData.glassMesh) {
                    dangerCup.scale.set(1.0, 1.0, 1.0);
                    dangerCup = null;
                }
                if (baulkLineMesh && baulkLineMesh.material) {
                    baulkLineMesh.material.color.setHex(0xfef3c7);
                    baulkLineMesh.material.opacity = 0.50;
                }
            }
        }

        function triggerGameOver(offendingCup) {
            if (isGameOver) return;
            isGameOver = true;
            isGameActive = false;
            tableFullWarningTimer = 0;

            exitBlastMode();

            // Çizgiyi geçen bardağın tam üzerinde kırmızı/altın uyarı efekti ve belirteç:
            if (offendingCup) {
                spawnMergeExplosion(offendingCup.position.x, 0.45, offendingCup.position.z, '#ef4444', 1.4);
                if (offendingCup.userData.glassMesh) {
                    offendingCup.scale.set(1.12, 1.12, 1.12);
                }
            }

            if (soundEnabled && audioCtx) {
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.85);
                    gain.gain.setValueAtTime(0.20, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.85);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.9);
                } catch(e) {}
            }

            const scoreEl = document.getElementById('game-over-score-val');
            if (scoreEl) scoreEl.textContent = gameScore.toLocaleString('tr-TR');

            // Kullanıcının çizgiyi geçen kupayı ve efekti net biçimde görmesi için 750ms sonra bitiş kutusu lüks animasyonla gelsin:
            setTimeout(() => {
                const modal = document.getElementById('game-over-modal');
                if (modal) modal.classList.remove('hidden');
            }, 750);
        }

        function startReviveRewardedAd(ev) {
            stopEvt(ev);
            ensureAudioContext();

            // Game over modalını hemen kapatıp reklam modalının öne geçmesini sağla
            const gameOverModal = document.getElementById('game-over-modal');
            if (gameOverModal) gameOverModal.classList.add('hidden');

            showRewardedAd(() => {
                clearSeventhLevelCupsAndResume();
            });
        }

        function clearSeventhLevelCupsAndResume() {
            const sevens = glasses.filter(g => !g.userData.isWaitingToLaunch && g.userData.level === 7);
            let removedCount = 0;

            if (sevens.length > 0) {
                sevens.forEach(g => {
                    spawnMergeExplosion(g.position.x, 0.45, g.position.z, '#a855f7', 1.25);
                    scene.remove(g);
                    const idx = glasses.indexOf(g);
                    if (idx !== -1) glasses.splice(idx, 1);
                    removedCount++;
                });
                gameScore += removedCount * 350;
            } else {
                const sorted = glasses
                    .filter(g => !g.userData.isWaitingToLaunch)
                    .sort((a, b) => b.userData.level - a.userData.level);
                const toClear = sorted.slice(0, 4);
                toClear.forEach(g => {
                    spawnMergeExplosion(g.position.x, 0.4, g.position.z, '#fde047', 1.0);
                    scene.remove(g);
                    const idx = glasses.indexOf(g);
                    if (idx !== -1) glasses.splice(idx, 1);
                    removedCount++;
                });
                gameScore += removedCount * 200;
            }

            // Çizgiye yakın kalan bardakları güvenli mesafeye kaydır
            glasses.forEach(g => {
                if (!g.userData.isWaitingToLaunch) {
                    const r = g.userData.radius;
                    if (g.position.z + r > LAUNCH_Z - 0.45) {
                        g.position.z = LAUNCH_Z - r - 0.45;
                        g.userData.vz = -0.06;
                        g.userData.vx = 0;
                    }
                }
            });

            updateScoreHUD();
            updateCaustics();

            const modal = document.getElementById('game-over-modal');
            if (modal) modal.classList.add('hidden');

            isGameOver = false;
            isGameActive = true;
            tableFullWarningTimer = 0;
            dangerCup = null;
            isDangerActive = false;
            if (baulkLineMesh && baulkLineMesh.material) {
                baulkLineMesh.material.color.setHex(0xfef3c7);
                baulkLineMesh.material.opacity = 0.50;
            }

            if (!waitingGlass || !waitingGlass.userData.isWaitingToLaunch) {
                spawnWaitingGlassAtShortEdge();
            }

            playGameSound('merge', 7);
            showToast('✨ 7. Seviye Kadehler Masadan Temizlendi! Bol Şans!');
        }

        function initEventListeners() {
            const canvas = document.getElementById('webgl-canvas');
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            let isPointerAiming = false;

            canvas.addEventListener('pointerdown', (e) => {
                if (!isGameActive) return;
                if (e.button !== undefined && e.button !== 0) return;

                if (isTargetBlastActive) {
                    handleBlastTap(e, canvas);
                    return;
                }

                isPointerAiming = true;
                const aimX = computeAimXFromEvent(e, canvas);
                updateStraightAimGuide(aimX);
            });

            window.addEventListener('pointermove', (e) => {
                if (!isGameActive || isTargetBlastActive) return;
                const aimX = computeAimXFromEvent(e, canvas);
                updateStraightAimGuide(aimX);
            });

            window.addEventListener('pointerup', (e) => {
                if (isTargetBlastActive) return;
                if (!isPointerAiming) return;
                isPointerAiming = false;
                if (!isGameActive) return;
                const aimX = computeAimXFromEvent(e, canvas);
                launchWaitingGlassStraightAtX(aimX);
            });

            window.addEventListener('resize', () => {
                const dims = getStageDimensions();
                if (renderer) renderer.setSize(dims.width, dims.height);
                updateResponsiveTerraceLayout();
                if (camera) updateCameraFromSpherical();
            });

            const reviveBtn = document.getElementById('btn-revive-ad');
            if (reviveBtn) {
                reviveBtn.addEventListener('click', (e) => startReviveRewardedAd(e));
            }
            const claimBtn = document.getElementById('btn-ad-claim');
            if (claimBtn) {
                claimBtn.addEventListener('click', (e) => claimAdReward(e));
            }
        }

        // =========================================================================
        // 10. ANA OYUN DÖNGÜSÜ
        // =========================================================================
        function animate() {
            requestAnimationFrame(animate);
            updateGamePhysics();
            updateExplosionEffects();
            updateFrictionTrailEffects();
            updateEarthquake();
            checkTableFullCondition();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            loadSavedPreferences();
            initScene();
            initEventListeners();
            animate();
        };
    </script>
</body>
