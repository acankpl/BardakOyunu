<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; media-src 'self' data: blob:;">
    <meta name="theme-color" content="#0b3b3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Akdeniz Bardak">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Akdeniz Terası: Bardak Birleştirme</title>

    <!-- 100% YEREL FONTLAR (Yurt dışına IP çıkışı yoktur - KVKK & GDPR Uyumlu) -->
    <link rel="stylesheet" href="assets/fonts/fonts.css">

    <!-- 100% YEREL 3B MOTOR VE MODEL YÜKLEYİCİLER -->
    <script src="assets/vendor/three.min.js"></script>
    <script src="assets/vendor/GLTFLoader.js"></script>
    <script src="assets/vendor/inline_glbs.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background-color: #162a2a;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff8eb;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        /* Gizlenen katmanların ve içindeki butonların tıklamaları ASLA engellememesi için kesin kural */
        .hidden {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .hidden * {
            pointer-events: none !important;
        }

        #portrait-stage-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            height: -webkit-fill-available;
            overflow: hidden;
            background: #1b3636;
        }

        /* Genişletilmiş Akdeniz Bahçesi Terası Oyun Arka Planı */
        #terrace-bg-img {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: none;
            max-height: none;
            pointer-events: none;
            z-index: 1;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: block;
            cursor: pointer;
            touch-action: none;
        }

        /* ===================================================================== */
        /* ÜST OYUN HUD: SIRADAKİ KUPA PANELİ, SKOR TABELASI VE AYAR DİŞLİSİ    */
        /* ===================================================================== */
        #top-game-hud {
            position: absolute;
            top: max(16px, calc(env(safe-area-inset-top, 0px) + 14px));
            left: 0;
            right: 0;
            z-index: 25;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 max(10px, env(safe-area-inset-right, 10px)) 0 max(10px, env(safe-area-inset-left, 10px));
            max-width: 620px;
            margin: 0 auto;
        }

        /* Sol Üst: Sıradaki Kupa HUD Paneli-1.png ve içindeki PNG Bardak (Kompakt ve Dengeli Yükseklik) */
        #next-cup-panel {
            position: relative;
            width: clamp(58px, 15vw, 82px);
            aspect-ratio: 1 / 1;
            margin-top: 7px;
            pointer-events: none;
            flex-shrink: 0;
            filter: drop-shadow(0 8px 16px rgba(10, 28, 24, 0.50));
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #next-cup-panel.cup-pop {
            transform: scale(1.07);
        }

        .next-panel-frame-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        .next-cup-window {
            position: absolute;
            left: 20%;
            top: 27%;
            width: 60%;
            height: 50%;
            overflow: hidden;
            border-radius: 14%;
            pointer-events: none;
        }

        #next-cup-img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: 50% 50%;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55));
            transition: transform 0.2s ease;
            pointer-events: none;
        }

        /* Orta Üst: skor_tabelasi.png ve üzerindeki skor yazısı */
        .score-plaque-container {
            position: relative;
            left: -4px;
            width: clamp(180px, 47vw, 280px);
            aspect-ratio: 1024 / 341;
            pointer-events: none;
            margin-top: 2px;
            filter: drop-shadow(0 10px 20px rgba(10, 28, 24, 0.52));
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .score-plaque-container.score-bump {
            transform: scale(1.06);
        }

        .score-plaque-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        #hud-score {
            position: absolute;
            left: 50%;
            top: 60.5%;
            transform: translate(-50%, -50%);
            width: 62%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.2rem, 4.7vw, 1.95rem);
            letter-spacing: 0.06em;
            line-height: 1;
            color: #fff3c4;
            background: linear-gradient(180deg, #fffbeb 0%, #fde68a 48%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.78));
            white-space: nowrap;
            pointer-events: none;
        }

        /* Sağ Üst: Oyun İçi Ayarlar Düğmesi (Skor tabelasıyla dengeli hizada) */
        #hud-settings-btn {
            position: relative;
            width: clamp(50px, 13.5vw, 70px);
            aspect-ratio: 1 / 1;
            background: transparent;
            border: none;
            border-radius: 50%;
            overflow: hidden;
            padding: 0;
            margin-top: 16px;
            cursor: pointer;
            pointer-events: auto;
            flex-shrink: 0;
            filter: drop-shadow(0 6px 14px rgba(10, 28, 24, 0.50));
            transition: transform 0.15s ease;
        }

        #hud-settings-btn:hover {
            transform: scale(1.05);
        }

        #hud-settings-btn:active {
            transform: scale(0.93);
        }

        #hud-settings-btn img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* ===================================================================== */
        /* AÇILIŞ & BAŞLAMA EKRANI (GENİŞLETİLMİŞ ARKA PLAN + PNG BUTONLAR)     */
        /* ===================================================================== */
        #start-menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: #1b3636;
            overflow: hidden;
        }

        /* Genişletilmiş (1254x1254) Başlangıç Ekranı Görseli: Oyun arka planı ile aynı bleed mantığında çalışır */
        #splash-bg-img {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: none;
            max-height: none;
            pointer-events: none;
            z-index: 1;
        }

        /* Merkezi 9:16 güvenli alan çerçevesi: Butonları 3 kupalı kaidenin tam altına hizalar */
        #splash-safe-frame {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        /* BAŞLAT Butonu (Orijinal Altın çerçeveli BAŞLAT düğmesi-1.png, 2033x592 tam oranlı) */
        #btn-splash-start {
            position: absolute;
            left: 50%;
            top: 71.5%;
            transform: translate(-50%, -50%);
            width: 66%;
            aspect-ratio: 2033 / 592;
            background: transparent;
            border: none;
            border-radius: 999px;
            overflow: visible;
            padding: 0;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 12px 20px rgba(10, 30, 26, 0.48));
            transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.16s ease;
        }

        #btn-splash-start:hover {
            transform: translate(-50%, -51.5%) scale(1.025);
            filter: drop-shadow(0 16px 26px rgba(10, 30, 26, 0.58)) brightness(1.05);
        }

        #btn-splash-start:active {
            transform: translate(-50%, -49%) scale(0.965);
        }

        #btn-splash-start img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* Alt Yuvarlak Butonlar: Ayarlar (Sol) ve Ses (Sağ) */
        .splash-circle-btn {
            position: absolute;
            top: 85.5%;
            transform: translate(-50%, -50%);
            width: 18.5%;
            aspect-ratio: 1 / 1;
            background: transparent;
            border: none;
            border-radius: 50%;
            overflow: visible;
            padding: 0;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 9px 14px rgba(68, 42, 16, 0.40));
            transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.16s ease;
        }

        .splash-circle-btn:hover {
            transform: translate(-50%, -51.5%) scale(1.04);
            filter: drop-shadow(0 12px 18px rgba(68, 42, 16, 0.48)) brightness(1.04);
        }

        .splash-circle-btn:active {
            transform: translate(-50%, -49%) scale(0.94);
        }

        .splash-circle-btn img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        #btn-splash-settings {
            left: 36.5%;
        }

        #btn-splash-sound {
            left: 63.5%;
        }

        #btn-splash-sound.sound-off::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 62%;
            height: 5px;
            background: #dc2626;
            border: 1.5px solid #fef3c7;
            border-radius: 99px;
            transform: translate(-50%, -50%) rotate(-42deg);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }

        /* ===================================================================== */
        /* YENİ AYARLAR MENÜSÜ PANELİ (Akdeniz Terası oyun ayarları paneli-2.png) */
        /* ===================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: radial-gradient(circle at 50% 35%, rgba(10, 38, 40, 0.78) 0%, rgba(4, 18, 20, 0.92) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* 1122x1402 oranlı yeni ayarlar kutusu */
        .settings-panel-box {
            position: relative;
            width: min(94vw, calc(90dvh * 1122 / 1402));
            max-width: 450px;
            aspect-ratio: 1122 / 1402;
            filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.72));
        }

        .settings-panel-bg {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* Mevcut Skor ve En Yüksek Rekor Değerleri (Yeşil kutuların içi - Tam dikey ve yatay ortalı) */
        .panel-score-val {
            position: absolute;
            top: 28.8%;
            transform: translate(-50%, -50%);
            width: 38%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.2rem, 5vw, 1.85rem);
            color: #fff3c4;
            background: linear-gradient(180deg, #fffbeb 0%, #fde68a 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.75));
            pointer-events: none;
        }

        #menu-current-score {
            left: 27.2%;
        }

        #menu-high-score {
            left: 71.5%;
        }

        /* KUPA GELİŞİMİ 7 Yuva İçindeki Kupa PNG'leri (Altın kutuların tam ortasında) */
        .panel-cup-slot {
            position: absolute;
            top: 48.15%;
            height: 9.0%;
            transform: translateY(-50%);
            overflow: hidden;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-cup-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(10, 26, 24, 0.40));
        }

        /* Panel Üzerindeki PNG Butonlar (Orijinal en-boy oranlarıyla bozulmasız yerleşim) */
        .panel-img-btn {
            position: absolute;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.14s ease, filter 0.14s ease;
            filter: drop-shadow(0 4px 8px rgba(55, 35, 12, 0.28));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-img-btn:hover {
            transform: scale(1.025);
            filter: drop-shadow(0 6px 12px rgba(55, 35, 12, 0.36)) brightness(1.03);
        }

        .panel-img-btn:active {
            transform: scale(0.965);
        }

        .panel-img-btn img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* 1. OYUNA DÖN Butonu */
        #btn-panel-resume {
            left: 26.5%;
            top: 57.8%;
            width: 47%;
            aspect-ratio: 2075 / 514;
            height: auto;
            border-radius: 999px;
        }

        /* 2. YENİ OYUN BAŞLAT Butonu */
        #btn-panel-restart {
            left: 26.5%;
            top: 68.4%;
            width: 47%;
            aspect-ratio: 2082 / 515;
            height: auto;
            border-radius: 999px;
        }

        /* 3. Orta Satır: SES, GRAFİK, ANA EKRAN (Tam oranlı, basık olmayan zarif butonlar) */
        #btn-panel-sound {
            left: 8.7%;
            top: 78.6%;
            width: 26.2%;
            height: 10.4%;
            border-radius: 16px;
        }

        #btn-panel-gfx {
            left: 36.9%;
            top: 78.6%;
            width: 26.2%;
            height: 10.4%;
            border-radius: 16px;
        }

        #btn-panel-home {
            left: 65.1%;
            top: 78.6%;
            width: 26.2%;
            height: 10.4%;
            border-radius: 16px;
        }

        /* SES ve GRAFİK düğmelerinin alt yarılarındaki canlı durum metni */
        .btn-sub-status {
            position: absolute;
            left: 50%;
            top: 70.0%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(0.60rem, 2.3vw, 0.82rem);
            color: #09484b;
            letter-spacing: 0.05em;
            pointer-events: none;
            white-space: nowrap;
        }

        /* 4. Alt Satır (Altın çizginin altı): GİZLİLİK & KVKK, KULLANIM KOŞULLARI, VERİLERİ SIFIRLA */
        #btn-panel-privacy {
            left: 8.7%;
            top: 90.0%;
            width: 26.4%;
            height: 4.45%;
            border-radius: 999px;
        }

        #btn-panel-terms {
            left: 36.8%;
            top: 90.0%;
            width: 26.4%;
            height: 4.45%;
            border-radius: 999px;
        }

        #btn-panel-reset {
            left: 64.9%;
            top: 90.0%;
            width: 26.4%;
            height: 4.45%;
            border-radius: 999px;
        }

        /* ===================================================================== */
        /* YASAL BİLGİLENDİRME (KVKK / GDPR / KULLANIM KOŞULLARI) MODALI         */
        /* ===================================================================== */
        .mediterranean-card {
            width: 100%;
            max-width: 460px;
            max-height: 88dvh;
            overflow-y: auto;
            background: linear-gradient(165deg, #fbf0de 0%, #eed7b5 55%, #dfc196 100%);
            border: 3px solid #c8912c;
            border-radius: 28px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.85);
            padding: 18px 16px;
            color: #1f2937;
            text-align: left;
        }

        .card-inner-frame {
            border: 1.5px solid rgba(180, 124, 34, 0.45);
            border-radius: 20px;
            padding: 14px 12px;
            background: rgba(255, 251, 242, 0.65);
        }

        .menu-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            background: #0d585c;
            color: #fde68a;
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
            border: 1px solid #d4a13e;
        }

        .menu-title {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.18rem;
            color: #0b4649;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .legal-content-scroll {
            max-height: 54dvh;
            overflow-y: auto;
            padding: 12px;
            background: rgba(255, 252, 245, 0.92);
            border: 1px solid rgba(180, 124, 34, 0.4);
            border-radius: 14px;
            font-size: 0.78rem;
            line-height: 1.55;
            color: #292524;
            margin: 8px 0 12px;
        }

        .legal-content-scroll h4 {
            font-family: 'Cinzel', serif;
            color: #0b4649;
            font-size: 0.85rem;
            margin: 10px 0 4px;
        }

        .legal-content-scroll h4:first-child {
            margin-top: 0;
        }

        .legal-content-scroll p,
        .legal-content-scroll ul {
            margin-bottom: 8px;
        }

        .legal-content-scroll ul {
            padding-left: 18px;
        }

        .btn-legal-close {
            display: block;
            width: 82%;
            margin: 0 auto;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .btn-legal-close img {
            width: 100%;
            height: auto;
            display: block;
        }

        #toast-banner {
            position: fixed;
            bottom: clamp(74px, 11vh, 98px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 80;
            background: rgba(11, 56, 58, 0.96);
            border: 1.5px solid #f59e0b;
            color: #fffbeb;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #toast-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===================================================================== */
        /* OYUN İÇİ ALT GÜÇLENDİRİCİ DOCK'U (BOOSTERS)                          */
        /* ===================================================================== */
        #bottom-boosters-dock {
            position: absolute;
            bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 3.0vw, 16px);
            z-index: 35;
            pointer-events: auto;
            width: min(92%, 350px);
        }

        .booster-png-btn {
            flex: 0 1 104px;
            max-width: 104px;
            height: clamp(60px, 8.4vh, 76px);
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.48));
            transition: transform 0.14s ease, filter 0.14s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
        }

        .booster-png-btn:hover {
            transform: translateY(-2px) scale(1.04);
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.60)) brightness(1.08);
        }

        .booster-png-btn:active {
            transform: translateY(1px) scale(0.96);
            filter: brightness(0.92);
        }

        .booster-png-btn img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* 3 Kupa Patlat Hedefleme Modu Üst Bilgi Şeridi */
        #blast-mode-banner {
            position: absolute;
            top: clamp(80px, 12vh, 105px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(185, 28, 28, 0.94);
            border: 1.5px solid #fca5a5;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 40;
            font-size: clamp(0.75rem, 2.4vw, 0.88rem);
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            white-space: nowrap;
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        .btn-cancel-blast {
            background: #ffffff;
            color: #991b1b;
            border: none;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 0.72rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .btn-cancel-blast:active {
            transform: scale(0.93);
        }

        /* ===================================================================== */
        /* ÖDÜLLÜ REKLAM MODALI (SİMÜLE REKLAM AKIŞI)                             */
        /* ===================================================================== */
        #rewarded-ad-modal {

        function playGameSound(type, level = 1) {
            if (!soundEnabled) return;
            const ctx = ensureAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;
            if (type === 'launch') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);
                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.23);
            } else if (type === 'clink') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(680 + level * 45, now);
                gain.gain.setValueAtTime(0.045, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            } else if (type === 'merge') {
                const baseFreq = 360 + level * 65;
                [1, 1.25, 1.5].forEach((mult, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    const startT = now + idx * 0.045;
                    osc.frequency.setValueAtTime(baseFreq * mult, startT);
                    gain.gain.setValueAtTime(0.11, startT);
                    gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.24);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startT);
                    osc.stop(startT + 0.25);
                });
            }
        }

        // Hem oyun arka planını hem de yeni genişletilmiş başlangıç ekranı arka planını aynı bleed mantığıyla ölçekler
        function updateResponsiveTerraceLayout() {
            const dims = getStageDimensions();
            const W = dims.width;
            const H = dims.height;

            const safeScale = Math.min(W / CORE_SAFE_W, H / CORE_SAFE_H);
            const coverScale = Math.max(W / EXPANDED_IMG_W, H / EXPANDED_IMG_H) * 1.06;
            const bgScale = Math.max(safeScale, coverScale);

            const renderW = Math.ceil(EXPANDED_IMG_W * bgScale);
            const renderH = Math.ceil(EXPANDED_IMG_H * bgScale);
            const isLandscapeWide = (W / H) > 1.15;
            const anchorY = isLandscapeWide ? 57 : 50;

            ['terrace-bg-img', 'splash-bg-img'].forEach(id => {
                const img = document.getElementById(id);
                if (!img) return;
                img.style.width = `${renderW}px`;
                img.style.height = `${renderH}px`;
                img.style.left = '50%';
                img.style.top = `${anchorY}%`;
                img.style.transform = `translate(-50%, -${anchorY}%)`;
            });

            // Başlangıç ekranındaki butonların yer aldığı merkezi 9:16 güvenli çerçeveyi kaidenin tam altına oturtur
            const splashFrame = document.getElementById('splash-safe-frame');
            if (splashFrame) {
                const frameW = Math.round(CORE_SAFE_W * safeScale);
                const frameH = Math.round(CORE_SAFE_H * safeScale);
                splashFrame.style.width = `${frameW}px`;
                splashFrame.style.height = `${frameH}px`;
            }
        }

        // Bardakların sağ arkasına ve tabanına düşen belirgin, doğal gölge dokusu (Sıfır kutu artefaktı, pürüzsüz geçiş)
        function createCupShadowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);

            // 1. Kupanın sağ arkasına uzanan belirgin yönlü gölge (Cast Shadow towards sağ-arka: +X, -Z)
            // Canvas Y < 256 kısmı sahne -Z (arka) yönüdür, Canvas X > 256 kısmı sahne +X (sağ) yönüdür.
            ctx.save();
            ctx.translate(284, 195); // Sağa (+X) ve arkaya (-Z) ofset
            ctx.scale(1.28, 1.48);  // Sağ arkaya doğru uzayan yumuşak eliptik gölge
            const castGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 85);
            castGrad.addColorStop(0, 'rgba(2, 14, 18, 0.72)');
            castGrad.addColorStop(0.35, 'rgba(3, 18, 22, 0.48)');
            castGrad.addColorStop(0.65, 'rgba(4, 24, 28, 0.18)');
            castGrad.addColorStop(0.85, 'rgba(4, 24, 28, 0.0)');
            castGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = castGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 85, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Kupanın tabanında masaya basmasını sağlayan koyu temas gölgesi (Ambient Occlusion)
            ctx.save();
            ctx.translate(256, 276);
            ctx.scale(1.10, 0.95);
            const contactGrad = ctx.createRadialGradient(0, 0, 6, 0, 0, 55);
            contactGrad.addColorStop(0, 'rgba(1, 8, 10, 0.88)');
            contactGrad.addColorStop(0.35, 'rgba(2, 12, 14, 0.62)');
            contactGrad.addColorStop(0.70, 'rgba(3, 18, 20, 0.18)');
            contactGrad.addColorStop(0.88, 'rgba(0, 0, 0, 0)');
            contactGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = contactGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const tex = new THREE.CanvasTexture(canvas);
            tex.generateMipmaps = true;
            return tex;
        }

        function updateCameraFromSpherical() {
            const dims = getStageDimensions();
            const W = dims.width;
            const H = dims.height;
            const aspect = W / H;

            let responsiveDist;
            const currentTarget = camState.target.clone();

            if (aspect < 0.5625) {
                // Dar mobil ekranlar (iPhone, Android 19:9, 20:9):
                // Masayı alt güçlendirici butonların hemen üstüne doğal olarak yerleştirir,
                // devasa boşluk bırakmadan ekranı dengeli ve lüks doldurur.
                responsiveDist = 12.6 * (0.5625 / Math.max(0.34, aspect)) * 0.88;
                currentTarget.y = -0.82;
                currentTarget.z = -0.32;
            } else if (aspect < 1.0) {
                // Tablet ve kareye yakın dikey ekranlar
                responsiveDist = 11.6 - (aspect - 0.5625) * 1.5;
                currentTarget.y = -0.78;
                currentTarget.z = 0.15;
            } else {
                // Yatay ekranlar
                responsiveDist = 11.0;
                currentTarget.y = -0.75;
                currentTarget.z = 0.62;
            }

            const sinP = Math.sin(camState.polar);
            const cosP = Math.cos(camState.polar);
            const sinA = Math.sin(camState.azimuth);
            const cosA = Math.cos(camState.azimuth);

            camera.position.x = currentTarget.x + responsiveDist * sinP * sinA;
            camera.position.y = currentTarget.y + responsiveDist * cosP;
            camera.position.z = currentTarget.z + responsiveDist * sinP * cosA;

            camera.fov = camState.fov;
            camera.aspect = W / H;
            camera.updateProjectionMatrix();
            camera.lookAt(currentTarget);
        }

        function createTableShadowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.scale(1, 2);
            const grad = ctx.createRadialGradient(128, 128, 28, 128, 128, 120);
            grad.addColorStop(0, 'rgba(38, 24, 10, 0.45)');
            grad.addColorStop(0.65, 'rgba(38, 24, 10, 0.22)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            ctx.restore();
            return new THREE.CanvasTexture(canvas);
        }

        function createFacetedCrystalMaterial(tint = 0xffffff, opacity = 0.82, roughness = 0.06) {

        function buildGlassByLevel(levelNum) {
            const spec = GLASS_LEVELS[levelNum] || GLASS_LEVELS[1];
            const root = new THREE.Group();
            const R = spec.radius;
            const H = spec.height;

            const shadowWidth = R * 3.2;
            const shadowHeight = R * 3.8;
            const shadowMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(shadowWidth, shadowHeight),
                new THREE.MeshBasicMaterial({
                    map: cupShadowBaseTexture,
                    transparent: true,
                    opacity: 0.75,
                    depthWrite: false
                })
            );
            shadowMesh.rotation.x = -Math.PI / 2;
            shadowMesh.position.set(R * 0.12, 0.003, -R * 0.22);
            root.add(shadowMesh);

            let glassMesh = null;
            if (customGLBModels[levelNum]) {
                glassMesh = customGLBModels[levelNum].clone(true);
                root.add(glassMesh);
            } else {
                const points = [
                    new THREE.Vector2(0.00, 0.02),
                    new THREE.Vector2(R * 0.78, 0.02),
                    new THREE.Vector2(R, H),
                    new THREE.Vector2(R * 0.88, H),
                    new THREE.Vector2(R * 0.70, 0.08),
                    new THREE.Vector2(0.00, 0.08)
                ];
                glassMesh = new THREE.Mesh(
                    new THREE.LatheGeometry(points, 12),
                    createFacetedCrystalMaterial(spec.liquidColor, 0.88, 0.12)
                );
                root.add(glassMesh);
            }

            root.userData = {
                id: glassIdCounter++,
                level: spec.level,
                type: spec.type,
                name: spec.name,
                shortName: spec.shortName,
                height: spec.height,
                radius: spec.radius,
                baseRadius: spec.baseRadius || (spec.radius * 0.65),
                topRadius: spec.topRadius || spec.radius,
                mass: spec.mass,
                vx: 0,
                vz: 0,
                isWaitingToLaunch: false,
                spawnAnimScale: 1.0,
                glassMesh: glassMesh,
                shadowMesh: shadowMesh,
                causticMesh: shadowMesh
            };

            return root;
        }

        function prepareNormalizedGLBCup(rawScene, spec) {
            const model = rawScene.clone(true);
            model.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = false;
                    child.receiveShadow = false;
                    if (child.geometry && !child.geometry.attributes.normal) {
                        child.geometry.computeVertexNormals();
                    }
                    if (child.material) {
                        if (child.material.map) {
                            child.material.map.encoding = THREE.sRGBEncoding;
                            if (renderer) {
                                child.material.map.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
                            }
                            child.material.map.needsUpdate = true;
                        }
                        child.material.roughness = 0.90;
                        child.material.metalness = 0.0;
                        child.material.envMap = null;
                        child.material.envMapIntensity = 0.0;
                        child.material.needsUpdate = true;
                    }
                }
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);

            // Kulp olan bardaklarda kulpların gövde çapını yanıltmasını ve hayalet duvar oluşturmasını engelle:
            // Gerçek seramik gövde çapı Z eksenindeki çaptır (size.z).
            const bodySpan = spec.hasHandle ? size.z : Math.max(size.x, size.z);
            const scaleXZ = (spec.radius * 2.0) / Math.max(0.01, bodySpan);
            const scaleY = (spec.height * 1.05) / Math.max(0.01, size.y);
            const scale = Math.min(scaleXZ, scaleY) * (spec.visualScale || 1.0);
            model.scale.setScalar(scale);

            const newBox = new THREE.Box3().setFromObject(model);
            const wrapper = new THREE.Group();
            if (spec.hasHandle) {
                // Kulplu bardaklarda seramik silindir gövdenin merkezini fizik dairesinin tam ortasına oturt:
                model.position.x = 0;
                model.position.z -= (newBox.min.z + newBox.max.z) / 2;
            } else {
                model.position.x -= (newBox.min.x + newBox.max.x) / 2;
                model.position.z -= (newBox.min.z + newBox.max.z) / 2;
            }
            model.position.y -= newBox.min.y;
            wrapper.add(model);
            return wrapper;
        }

        function upgradeExistingGlassesForLevel(lvl) {
            if (!customGLBModels[lvl]) return;
            glasses.forEach(g => {
                if (g.userData && g.userData.level === lvl) {
                    if (g.userData.glassMesh) g.remove(g.userData.glassMesh);
                    const customClone = customGLBModels[lvl].clone(true);
                    g.add(customClone);
                    g.userData.glassMesh = customClone;
                }
            });
        }

        async function decompressGzipBase64ToArrayBuffer(b64) {
            const binStr = atob(b64);
            const bytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) {
                bytes[i] = binStr.charCodeAt(i);
            }
            if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                writer.write(bytes);
                writer.close();
                return await new Response(ds.readable).arrayBuffer();
            }
            return bytes.buffer;
        }

        function applyLoadedTableGLB(gltf) {
            if (!tableModelGroup || !gltf || !gltf.scene) return;
            const tableMesh = gltf.scene.clone(true);
            tableMesh.traverse(child => {
                if (child.isMesh) {
                    if (child.geometry && !child.geometry.attributes.normal) {
                        child.geometry.computeVertexNormals();
                    }
                    if (child.material) {
                        if (child.material.map) {
                            child.material.map.encoding = THREE.sRGBEncoding;
                            if (renderer) {
                                child.material.map.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
                            }
                            child.material.map.needsUpdate = true;
                        }
                        child.material.roughness = 0.92;
                        child.material.metalness = 0.0;
                        child.material.envMap = null;
                        child.material.envMapIntensity = 0.0;
                        child.material.needsUpdate = true;
                    }
                }
            });

            // GLB içindeki uzun eksen (X) dünya Z eksenine, kısa eksen (Z) dünya X eksenine döner.
            // İç turkuaz yatak (localY = +0.0635) tam Y = 0 fizik düzlemine oturtulur.
            tableMesh.rotation.y = Math.PI / 2;
            tableMesh.scale.setScalar(TABLE_GLB_SCALE);
            tableMesh.position.set(0, -0.0635 * TABLE_GLB_SCALE, 0);

            if (tableFallbackMesh) {
                tableFallbackMesh.visible = false;
            }
            tableModelGroup.add(tableMesh);
        }

        function preloadAllDefaultGLBCups() {
            const loader = new THREE.GLTFLoader();
            const inlineMap = window.INLINE_GLB_GZIP_B64 || {};
            const isFileProtocol = (window.location.protocol === 'file:');

            // 1. 3B Masa Modelini (.glb) Yükle
            const loadTableFromInline = async () => {
                const gzB64 = inlineMap[TABLE_GLB_FILE];
                if (!gzB64) return;
                try {
                    const arrayBuffer = await decompressGzipBase64ToArrayBuffer(gzB64);
                    loader.parse(arrayBuffer, '', applyLoadedTableGLB);
                } catch (e) { }
            };

            if (isFileProtocol && inlineMap[TABLE_GLB_FILE]) {
                loadTableFromInline();
            } else {
                loader.load(
                    TABLE_GLB_FILE,
                    applyLoadedTableGLB,
                    undefined,
                    () => { loadTableFromInline(); }
                );
            }

            // 2. 7 Seviye 3B Kupa Modellerini (.glb) Yükle
            Object.keys(GLASS_LEVELS).forEach(async (key) => {
                const lvl = parseInt(key, 10);
                const spec = GLASS_LEVELS[lvl];
                if (!spec || !spec.glbFile) return;

                const applyLoadedGltf = (gltf) => {
                    customGLBModels[lvl] = prepareNormalizedGLBCup(gltf.scene, spec);
                    upgradeExistingGlassesForLevel(lvl);
                };

                const loadFromInlineFallback = async () => {
                    const gzB64 = inlineMap[spec.glbFile];
                    if (!gzB64) return;
                    try {
                        const arrayBuffer = await decompressGzipBase64ToArrayBuffer(gzB64);
                        loader.parse(arrayBuffer, '', applyLoadedGltf);
                    } catch (e) { }
                };

                if (isFileProtocol && inlineMap[spec.glbFile]) {
                    await loadFromInlineFallback();
                } else {
                    loader.load(
                        spec.glbFile,
                        applyLoadedGltf,
                        undefined,
                        () => { loadFromInlineFallback(); }
                    );
                }
            });
        }

            const canvas = document.createElement('canvas');

            ctx.beginPath();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
            ctx.fill();
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#d97706';

            ctx.beginPath();
            ctx.arc(128, 128, 102, 0, Math.PI * 2);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#fef08a';

            ctx.fillStyle = '#fde047';
            ctx.font = 'bold 88px Cinzel, serif';

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Plus Jakarta Sans, sans-serif';
            ctx.fillText(label || ('SEV. ' + levelNum), 128, 172);

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;

        function spawnWaitingGlassAtShortEdge() {
            const spawnLvl = nextRandomLevel;
            nextRandomLevel = pickRandomSpawnLevel();
            updateScoreHUD();

            const nextPanel = document.getElementById('next-cup-panel');
            if (nextPanel) {
                nextPanel.classList.remove('cup-pop');
                void nextPanel.offsetWidth;
                nextPanel.classList.add('cup-pop');
                setTimeout(() => nextPanel.classList.remove('cup-pop'), 200);
            }

            const g = buildGlassByLevel(spawnLvl);
            const r = g.userData.radius;
            const clampedX = THREE.MathUtils.clamp(currentAimX, PLAY_MIN_X + r, PLAY_MAX_X - r);
            g.position.set(clampedX, 0, LAUNCH_Z);
            g.userData.isWaitingToLaunch = true;
            g.userData.spawnAnimScale = 0.2;
            g.scale.setScalar(0.2);

            scene.add(g);
            glasses.push(g);
            waitingGlass = g;
            updateStraightAimGuide(clampedX);
            updateCaustics();
        }

        function updateStraightAimGuide(rawX) {
            const r = waitingGlass ? waitingGlass.userData.radius : 0.26;
            currentAimX = THREE.MathUtils.clamp(rawX, PLAY_MIN_X + r, PLAY_MAX_X - r);

            if (waitingGlass && waitingGlass.userData.isWaitingToLaunch) {
                waitingGlass.position.x = currentAimX;
                waitingGlass.position.z = LAUNCH_Z;
            }

            if (!aimGuideGroup) return;
            const aimLine = aimGuideGroup.getObjectByName('aimLine');
            const targetRing = aimGuideGroup.getObjectByName('targetRing');
            const farZ = PLAY_MIN_Z + r + 0.08;

            if (aimLine) {
                const pos = aimLine.geometry.attributes.position.array;
                pos[0] = currentAimX;
                pos[1] = 0.05;
                pos[2] = LAUNCH_Z - r;
                pos[3] = currentAimX;
                pos[4] = 0.05;
                pos[5] = farZ;
                aimLine.geometry.attributes.position.needsUpdate = true;
                aimLine.computeLineDistances();
            }
            if (targetRing) {
                targetRing.position.set(currentAimX, 0.012, farZ);
            }
        }

        function launchWaitingGlassStraightAtX(clickX) {
            if (!isGameActive || !waitingGlass || !waitingGlass.userData.isWaitingToLaunch || isSpawningNext) return;

            updateStraightAimGuide(clickX);
            const launched = waitingGlass;
            launched.userData.isWaitingToLaunch = false;
            launched.userData.isLaunchedSlide = true;
            launched.userData.launchGraceTime = 0.35;
            launched.position.x = currentAimX;
            launched.position.z = LAUNCH_Z;
            launched.userData.vx = 0;
            launched.userData.vz = -INITIAL_LAUNCH_SPEED;

            playGameSound('launch', launched.userData.level);

            waitingGlass = null;
            isSpawningNext = true;

            setTimeout(() => {
                isSpawningNext = false;
                spawnWaitingGlassAtShortEdge();
            }, 420);
        }

        function spawnMergeExplosion(x, y, z, colorHex, radius) {
            const group = new THREE.Group();
            group.position.set(x, y + 0.18, z);

            const ringGeo = new THREE.RingGeometry(radius * 0.4, radius * 0.68, 24);
            const ringMat = new THREE.MeshBasicMaterial({
                color: colorHex,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });
            const shockRing = new THREE.Mesh(ringGeo, ringMat);
            shockRing.rotation.x = -Math.PI / 2;
            group.add(shockRing);

            const particles = [];
            const pGeo = new THREE.OctahedronGeometry(0.055, 0);
            for (let i = 0; i < 14; i++) {
                const pMat = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? colorHex : 0xfef08a,
                    transparent: true,
                    opacity: 1.0
                });
                const p = new THREE.Mesh(pGeo, pMat);
                const ang = (i / 14) * Math.PI * 2;
                const spd = 0.04 + Math.random() * 0.055;
                p.userData = {
                    vx: Math.cos(ang) * spd,
                    vy: 0.04 + Math.random() * 0.055,
                    vz: Math.sin(ang) * spd
                };
                group.add(p);
                particles.push(p);
            }

            scene.add(group);
            explosionEffects.push({ group, shockRing, particles, age: 0, maxAge: 26 });
        }

        function updateExplosionEffects() {
            for (let i = explosionEffects.length - 1; i >= 0; i--) {
                const ef = explosionEffects[i];
                ef.age++;
                const t = ef.age / ef.maxAge;

                ef.shockRing.scale.setScalar(1 + t * 3.1);
                ef.shockRing.material.opacity = (1 - t) * 0.85;

                ef.particles.forEach(p => {
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.vy -= 0.0035;
                    p.material.opacity = 1 - t;
                });

                if (ef.age >= ef.maxAge) {
                    scene.remove(ef.group);
                    explosionEffects.splice(i, 1);
                }
            }
        }

        function spawnFrictionSlideTrail(x, z, radius, colorHex) {
            const trailGeo = new THREE.CircleGeometry(radius * 0.42, 12);
            const trailMat = new THREE.MeshBasicMaterial({
                color: colorHex,

            frictionTrailEffects.push({ mesh, age: 0, maxAge: 16 });
